<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb TO BE - Grammar Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f0f9ff;
        }
        .btn-option {
            transition: all 0.2s ease;
        }
        .btn-option:active {
            transform: scale(0.95);
        }
        .word-chip {
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .word-chip:hover {
            transform: translateY(-2px);
            background-color: #e0f2fe;
        }
        .word-chip.selected {
            opacity: 0.3;
            pointer-events: none;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden mt-4">
        
        <!-- Header -->
        <div class="bg-blue-500 p-6 text-white text-center relative">
            <h1 id="game-title" class="text-3xl font-bold">Verb "To Be" Quiz</h1>
            <p id="game-subtitle" class="text-blue-100 italic">Present Simple Practice</p>
            <div id="progress-bar" class="absolute bottom-0 left-0 h-1 bg-yellow-400 transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Content Area -->
        <div id="content" class="p-8">
            <!-- Initial State (Welcome) -->
            <div id="start-screen" class="text-center space-y-6">
                <div class="text-6xl animate-bounce-slow">📚</div>
                <h2 class="text-2xl font-semibold text-gray-700">Ready to learn?</h2>
                <p class="text-gray-500">We will practice: <br>1. is / am / are <br>2. Affirmative vs Negative <br>3. Sentence Building</p>
                <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transform transition active:scale-95">
                    START NOW!
                </button>
            </div>

            <!-- Quiz Template (Dynamic) -->
            <div id="quiz-screen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <span id="question-count" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">Q 1/10</span>
                    <span id="score-display" class="text-green-600 font-bold">Score: 0</span>
                </div>

                <div id="question-container" class="space-y-6">
                    <!-- Question Image/Emoji -->
                    <div id="visual-cue" class="text-7xl text-center py-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                        😊
                    </div>

                    <!-- Sentence -->
                    <div id="sentence-box" class="text-center text-2xl font-medium text-gray-800">
                        She <span class="text-blue-500 border-b-2 border-blue-200 px-4">____</span> happy.
                    </div>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 gap-3 pt-4">
                        <!-- Buttons added via JS -->
                    </div>

                    <!-- Unscramble Area -->
                    <div id="unscramble-container" class="hidden space-y-4">
                        <div id="target-sentence" class="flex flex-wrap justify-center gap-2 min-h-[60px] p-3 border-2 border-blue-100 rounded-xl bg-blue-50">
                            <!-- Selected words -->
                        </div>
                        <div id="word-bank" class="flex flex-wrap justify-center gap-2 pt-4">
                            <!-- Shuffle words -->
                        </div>
                        <div class="text-center">
                            <button id="listen-btn" onclick="speakCurrentSentence()" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-full">
                                🔊 Listen
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Feedback Area -->
                <div id="feedback-box" class="mt-8 text-center h-12 flex items-center justify-center font-bold text-xl"></div>
                
                <!-- Next Button -->
                <div class="mt-6 flex justify-center">
                    <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md transition transform active:scale-95">
                        Next Question &rarr;
                    </button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="result-screen" class="hidden text-center space-y-6">
                <h2 class="text-4xl font-bold text-gray-800">Finished! 🎉</h2>
                <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100">
                    <p class="text-xl">Your Total Score:</p>
                    <p id="final-score" class="text-6xl font-bold text-blue-600 my-2">0/0</p>
                    <p id="accuracy-text" class="text-gray-600"></p>
                </div>
                <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <!-- Attribution -->
    <p class="text-gray-400 mt-8 text-sm">Created for Pre-A1 English Learners</p>

    <script>
        // --- DATA ---
        const part1 = [
            { id: 1, type: 'choice', visual: '😊', sentence: 'She ____ happy.', options: ['is', 'am', 'are'], answer: 'is' },
            { id: 2, type: 'choice', visual: '😢', sentence: 'The boy ____ sad.', options: ['is', 'am', 'are'], answer: 'is' },
            { id: 3, type: 'choice', visual: '🛌', sentence: 'They ____ tired.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 4, type: 'choice', visual: '🍔', sentence: 'We ____ hungry.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 5, type: 'choice', visual: '😡', sentence: 'He ____ angry.', options: ['is', 'am', 'are'], answer: 'is' },
            { id: 6, type: 'choice', visual: '😴', sentence: 'I ____ sleepy.', options: ['is', 'am', 'are'], answer: 'am' },
            { id: 7, type: 'choice', visual: '🚗✨', sentence: 'The cars ____ clean.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 8, type: 'choice', visual: '🤒', sentence: 'Lily ____ sick.', options: ['is', 'am', 'are'], answer: 'is' },
            { id: 9, type: 'choice', visual: '💪', sentence: 'You ____ strong.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 10, type: 'choice', visual: '👦🤝👦', sentence: 'Jack and Alex ____ friends.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 11, type: 'choice', visual: '✏️📏', sentence: 'The pen and ruler ____ in the bag.', options: ['is', 'am', 'are'], answer: 'are' },
            { id: 12, type: 'choice', visual: '🥶', sentence: 'It ____ cold.', options: ['is', 'am', 'are'], answer: 'is' }
        ];

        const part2 = [
            { id: 13, type: 'choice', visual: '😊', sentence: 'He ____ happy.', options: ['is', "isn't"], answer: 'is' },
            { id: 14, type: 'choice', visual: '😢', sentence: 'She ____ happy.', options: ['is', "isn't"], answer: "isn't" },
            { id: 15, type: 'choice', visual: '🍎🍎', sentence: 'The apples ____ red.', options: ['are', "aren't"], answer: 'are' },
            { id: 16, type: 'choice', visual: '😊', sentence: 'Tom ____ angry.', options: ['is', "isn't"], answer: "isn't" },
            { id: 17, type: 'choice', visual: '👭', sentence: 'Mia and Lily ____ friends.', options: ['are', "aren't"], answer: 'are' },
            { id: 18, type: 'choice', visual: '🐶🥣', sentence: 'The dog ____ hungry.', options: ['is', "isn't"], answer: 'is' },
            { id: 19, type: 'choice', visual: '👧', sentence: 'I ____ big.', options: ['am', 'am not'], answer: 'am' },
            { id: 20, type: 'choice', visual: '☀️🥵', sentence: 'He ____ cold.', options: ['is', "isn't"], answer: "isn't" }
        ];

        const part3 = [
            { id: 21, type: 'scramble', visual: '😊', text: "I'm very happy today.", answer: ["I'm", "very", "happy", "today."] },
            { id: 22, type: 'scramble', visual: '🏫', text: "She's in the classroom.", answer: ["She's", "in", "the", "classroom."] },
            { id: 23, type: 'scramble', visual: '🤝', text: "We're very good friends.", answer: ["We're", "very", "good", "friends."] },
            { id: 24, type: 'scramble', visual: '🛝', text: "They're at the playground.", answer: ["They're", "at", "the", "playground."] },
            { id: 25, type: 'scramble', visual: '🏠', text: "He isn't at school.", answer: ["He", "isn't", "at", "school."] },
            { id: 26, type: 'scramble', visual: '👔', text: "You aren't very busy.", answer: ["You", "aren't", "very", "busy."] },
            { id: 27, type: 'scramble', visual: '🐶❌🥣', text: "The dog isn't hungry.", answer: ["The", "dog", "isn't", "hungry."] },
            { id: 28, type: 'scramble', visual: '📚 Old', text: "My books aren't new.", answer: ["My", "books", "aren't", "new."] }
        ];

        // --- GAME STATE ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let wrongAttempts = 0;
        let selectedWords = [];
        let canAnswer = true;

        const compliments = ["Well done!", "Good job!", "Excellent!", "Very good!"];
        const praiseSounds = ["👏", "✨", "🌟", "🎈"];

        // --- UTILS ---
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // --- CORE LOGIC ---
        function startGame() {
            // Mix questions: Shuffle within sections, then combine
            currentQuestions = [
                ...shuffle(part1),
                ...shuffle(part2),
                ...shuffle(part3)
            ];
            
            currentIndex = 0;
            score = 0;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            renderQuestion();
        }

        function renderQuestion() {
            canAnswer = true;
            wrongAttempts = 0;
            selectedWords = [];
            
            const q = currentQuestions[currentIndex];
            const feedback = document.getElementById('feedback-box');
            const nextBtn = document.getElementById('next-btn');
            
            feedback.innerHTML = '';
            feedback.className = "mt-8 text-center h-12 flex items-center justify-center font-bold text-xl";
            nextBtn.classList.add('hidden');

            // Update Progress
            document.getElementById('question-count').innerText = `Q ${currentIndex + 1}/${currentQuestions.length}`;
            document.getElementById('score-display').innerText = `Score: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;

            // Visual Cue
            document.getElementById('visual-cue').innerText = q.visual;

            if (q.type === 'choice') {
                document.getElementById('sentence-box').classList.remove('hidden');
                document.getElementById('unscramble-container').classList.add('hidden');
                document.getElementById('options-grid').classList.remove('hidden');
                
                document.getElementById('sentence-box').innerHTML = q.sentence.replace('____', '<span id="blank" class="text-blue-500 border-b-2 border-blue-200 px-4 min-w-[60px] inline-block">____</span>');
                
                const grid = document.getElementById('options-grid');
                grid.innerHTML = '';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "btn-option bg-white border-2 border-gray-200 hover:border-blue-400 hover:bg-blue-50 py-4 px-6 rounded-2xl text-xl font-medium text-gray-700 shadow-sm";
                    btn.innerText = opt;
                    btn.onclick = () => checkChoice(opt);
                    grid.appendChild(btn);
                });
            } else {
                // Unscramble Type
                document.getElementById('sentence-box').classList.add('hidden');
                document.getElementById('options-grid').classList.add('hidden');
                document.getElementById('unscramble-container').classList.remove('hidden');
                
                document.getElementById('target-sentence').innerHTML = '';
                const bank = document.getElementById('word-bank');
                bank.innerHTML = '';
                
                const shuffledWords = shuffle([...q.answer]);
                shuffledWords.forEach((word, idx) => {
                    const chip = document.createElement('div');
                    chip.className = "word-chip bg-white border-2 border-gray-200 py-2 px-4 rounded-lg text-lg font-medium text-gray-700 shadow-sm";
                    chip.innerText = word;
                    chip.dataset.idx = idx;
                    chip.onclick = () => handleWordClick(chip, word);
                    bank.appendChild(chip);
                });

                // Auto speak
                setTimeout(() => speakCurrentSentence(), 500);
            }
        }

        function checkChoice(userAnswer) {
            if (!canAnswer) return;
            const q = currentQuestions[currentIndex];
            
            if (userAnswer === q.answer) {
                handleSuccess(userAnswer);
            } else {
                handleFailure();
            }
        }

        function handleWordClick(chipElement, word) {
            if (!canAnswer) return;
            
            // Add to target
            selectedWords.push(word);
            chipElement.classList.add('selected');
            
            const target = document.getElementById('target-sentence');
            const newWord = document.createElement('span');
            newWord.className = "bg-blue-100 text-blue-800 px-3 py-1 rounded shadow-sm animate-pulse";
            newWord.innerText = word;
            target.appendChild(newWord);

            const q = currentQuestions[currentIndex];
            if (selectedWords.length === q.answer.length) {
                if (selectedWords.join(' ') === q.answer.join(' ')) {
                    handleSuccess();
                } else {
                    handleFailure();
                    // Reset scramble area
                    setTimeout(() => {
                        selectedWords = [];
                        target.innerHTML = '';
                        document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('selected'));
                    }, 1000);
                }
            }
        }

        function handleSuccess(finalVal) {
            canAnswer = false;
            score++;
            document.getElementById('score-display').innerText = `Score: ${score}`;
            
            if (finalVal) {
                document.getElementById('blank').innerText = finalVal;
                document.getElementById('blank').classList.replace('text-blue-500', 'text-green-600');
            }

            const fb = document.getElementById('feedback-box');
            fb.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            fb.classList.add('text-green-600');
            
            playSound('correct');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function handleFailure() {
            wrongAttempts++;
            const fb = document.getElementById('feedback-box');
            fb.innerText = "Try again! ❌";
            fb.classList.add('text-red-500');
            playSound('wrong');

            if (wrongAttempts >= 3) {
                const q = currentQuestions[currentIndex];
                const ans = Array.isArray(q.answer) ? q.answer.join(' ') : q.answer;
                fb.innerHTML = `<span class="text-gray-500 text-sm block">Answer: ${ans}</span>`;
                document.getElementById('next-btn').classList.remove('hidden');
                canAnswer = false;
            } else {
                setTimeout(() => {
                    fb.innerText = '';
                    fb.classList.remove('text-red-500');
                }, 1500);
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = `${score}/${currentQuestions.length}`;
            const percent = (score / currentQuestions.length) * 100;
            let msg = "";
            if (percent === 100) msg = "Perfect! You are a superstar! 🌟";
            else if (percent > 70) msg = "Great job! Keep practicing! 👍";
            else msg = "Good effort! Let's try again! 💪";
            document.getElementById('accuracy-text').innerText = msg;
        }

        // --- AUDIO SYSTEM ---
        function speakCurrentSentence() {
            const q = currentQuestions[currentIndex];
            if (!q) return;
            
            const text = q.type === 'choice' ? q.sentence.replace('____', q.answer) : q.text;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // Slower for Pre-A1
            speechSynthesis.speak(utterance);
        }

        function playSound(type) {
            // Using Web Audio API for simple beeps since we can't load external assets easily
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const nextBtn = document.getElementById('next-btn');
                if (!nextBtn.classList.contains('hidden')) {
                    nextQuestion();
                }
            }
        });

        document.getElementById('next-btn').onclick = nextQuestion;

    </script>
</body>
</html>
